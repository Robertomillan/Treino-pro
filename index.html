<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Treino Pro & Ficha Personalizada</title>
  <style>
    :root {
      --bg: #090d14;
      --card-bg: #121824;
      --border: #232d3f;
      --text: #e1e7ed;
      --muted: #8b9bb0;
      --accent: #10b981;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.4;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 20, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px 6px 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .logo {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .logo span { color: var(--accent); }

    .view-toggle-btn {
      background: #1c2638;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .sub-nav {
      display: flex !important;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 12px;
      background: #0e1624;
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      align-items: center;
    }

    .sub-btn {
      background: #182232;
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    .sub-btn.active {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
    }

    .athlete-banner {
      background: linear-gradient(135deg, #172033 0%, #0e1626 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .athlete-name {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .athlete-philosophy {
      font-size: 11px;
      color: var(--gold);
      margin-top: 2px;
    }

    .ex-list { padding: 0 10px; }

    .ex-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .ex-card.open { border-color: #38bdf8; }

    .ex-card-header {
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }

    .svg-thumb {
      width: 54px;
      height: 54px;
      background: #090d14;
      border-radius: 8px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .svg-thumb svg { width: 100%; height: 100%; display: block; }

    .ex-meta { flex: 1; min-width: 0; }

    .ex-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .ex-series-info {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      margin-top: 2px;
    }

    .ex-tech-note {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ex-card-body {
      display: none;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: #0c1018;
    }

    body.mode-open-all .ex-card-body,
    .ex-card.open .ex-card-body {
      display: block !important;
    }

    .full-tech-box {
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--blue);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #93c5fd;
      margin-bottom: 10px;
    }

    .set-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }

    .set-table th {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px;
      text-align: center;
    }

    .set-table td {
      padding: 4px;
      text-align: center;
    }

    .log-input {
      width: 100%;
      max-width: 60px;
      background: #04070c;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 5px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .check-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #04070c;
      color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .start-rest-btn {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #38bdf8;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0f172a;
      border-top: 2px solid var(--accent);
      padding: 10px 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
    }

    .timer-bar.active { display: flex; }

    .timer-digits {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
    }

    .timer-stop-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }
  </style>
</head>

      activeTab = type;
      activeSubIdx = 0;

      const buttons = document.querySelectorAll('#mainNav .tab-btn');
      buttons.forEach(b => b.classList.remove('active'));

      if (type === 'pro') {
        activeProIdx = val;
        buttons[val].classList.add('active');
      } else {
        activeFichaKey = val;
        if (val === 'ABCD') buttons[6].classList.add('active');
        if (val === 'ABC') buttons[7].classList.add('active');
      }

      renderApp();
    }

    function switchSubTab(idx) {
      activeSubIdx = idx;
      renderSubNav();
      renderContent();
    }

    function renderApp() {
      renderHeaderAndBanner();
      renderSubNav();
      renderContent();
    }

    function renderHeaderAndBanner() {
      const bannerTitle = document.getElementById('bannerTitle');
      const bannerDesc = document.getElementById('bannerDesc');

      if (activeTab === 'pro') {
        const pro = PRO_DATA[activeProIdx];
        bannerTitle.innerText = pro.name;
        bannerDesc.innerText = `${pro.title} — ${pro.philosophy}`;
      } else {
        const ficha = USER_FICHAS[activeFichaKey];
        bannerTitle.innerText = ficha.title;
        bannerDesc.innerText = ficha.philosophy;
      }
    }

    function renderSubNav() {
      const container = document.getElementById('subNav');
      let items = [];

      if (activeTab === 'pro') {
        items = PRO_DATA[activeProIdx].groups.map(g => g.name);
      } else {
        items = USER_FICHAS[activeFichaKey].days.map(d => d.name);
      }

      container.innerHTML = items.map((name, idx) => `
        <button class="sub-btn ${idx === activeSubIdx ? 'active' : ''}" onclick="switchSubTab(${idx})">
          ${name}
        </button>
      `).join('');
    }

    function renderContent() {
      const container = document.getElementById('contentContainer');
      let exsList = [];
      let prefixKey = '';

      if (activeTab === 'pro') {
        const group = PRO_DATA[activeProIdx].groups[activeSubIdx];
        if (!group) return;
        exsList = group.exs;
        prefixKey = `pro_${activeProIdx}_${activeSubIdx}`;
      } else {
        const day = USER_FICHAS[activeFichaKey].days[activeSubIdx];
        if (!day) return;
        exsList = day.exs;
        prefixKey = `ficha_${activeFichaKey}_${activeSubIdx}`;
      }

      container.innerHTML = `
        <div class="ex-list">
          ${exsList.map((ex, idx) => createCardHTML(ex, `${prefixKey}_${idx}`)).join('')}
        </div>
      `;
    }

    function createCardHTML(ex, key) {
      const svgIcon = SVGS[ex.svg] || SVGS.supino;

      let numSets = 3;
      if (ex.series.includes('7 x')) numSets = 7;
      else if (ex.series.includes('5 x')) numSets = 5;
      else if (ex.series.includes('4 x')) numSets = 4;
      else if (ex.series.includes('2 x')) numSets = 2;
      else if (ex.series.includes('1 x')) numSets = 1;

      let setRowsHTML = '';
      for (let s = 1; s <= numSets; s++) {
        const wKey = `${key}_s${s}_w`;
        const rKey = `${key}_s${s}_r`;
        const cKey = `${key}_s${s}_c`;

        const valW = userLogs[wKey] || '';
        const valR = userLogs[rKey] || '';
        const isDone = userLogs[cKey] || false;

        setRowsHTML += `
          <tr>
            <td style="font-size: 11px; font-weight: 800; color: var(--muted);">S${s}</td>
            <td><input type="number" class="log-input" placeholder="kg" value="${valW}" onchange="saveInput('${wKey}', this.value)"></td>
            <td><input type="number" class="log-input" placeholder="reps" value="${valR}" onchange="saveInput('${rKey}', this.value)"></td>
            <td>
              <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleCheck('${cKey}', this)">✓</button>
            </td>
          </tr>
        `;
      }

      return `
        <div class="ex-card" id="card_${key}">
          <div class="ex-card-header" onclick="toggleCard('card_${key}')">
            <div class="svg-thumb">${svgIcon}</div>
            <div class="ex-meta">
              <div class="ex-title">${ex.name}</div>
              <div class="ex-series-info">📌 ${ex.series}</div>
              <div class="ex-tech-note">${ex.tech}</div>
            </div>
          </div>
          <div class="ex-card-body">
            <div class="full-tech-box">
              <strong>Técnica:</strong> ${ex.tech}
            </div>
            <table class="set-table">
              <thead>
                <tr>
                  <th>Série</th>
                  <th>Carga</th>
                  <th>Reps</th>
                  <th>Concluída</th>
                </tr>
              </thead>
              <tbody>${setRowsHTML}</tbody>
            </table>
            <button class="start-rest-btn" onclick="startTimer(${ex.rest || 90})">
              ▶ Descanso (${ex.rest || 90}s)
            </button>
          </div>
        </div>
      `;
    }

    function toggleCard(id) {
      if (viewModeOpenAll) return;
      const card = document.getElementById(id);
      if (card) card.classList.toggle('open');
    }

    function saveInput(key, val) {
      userLogs[key] = val;
      saveLogs();
    }

    function toggleCheck(key, btn) {
      const current = !!userLogs[key];
      userLogs[key] = !current;
      btn.classList.toggle('done', !current);
      saveLogs();
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      const timerBar = document.getElementById('timerBar');
      const timerDigits = document.getElementById('timerDigits');

      timerBar.classList.add('active');

      function updateDisplay() {
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        timerDigits.innerText = `${m}:${s}`;
      }

      updateDisplay();

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining < 0) {
          stopTimer();
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timerBar').classList.remove('active');
    }
  </script>
</body>
</html>
