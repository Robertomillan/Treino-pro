function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('O armazenamento está indisponível neste navegador.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function applySettings(){document.body.dataset.theme=state.settings.theme||'dark';document.documentElement.style.setProperty('--accent',state.settings.accent);document.documentElement.style.setProperty('--font',state.settings.font+'px');document.body.classList.toggle('compact',!!state.settings.compact)}

function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.logs||!Array.isArray(x.sessions))throw Error();if(confirm('Substituir os registros atuais pelo backup?')){state={...state,...x};save();render()}}catch(e){alert('Arquivo de backup inválido')}};r.readAsText(f)}
function renderSettings(){return '<h1>Personalização</h1><div class="card"><label for="theme">Tema visual</label><select id="theme" onchange="state.settings.theme=this.value;save();render()">'+[['dark','Escuro'],['light','Claro'],['navy','Azul executivo'],['graphite','Grafite'],['contrast','Alto contraste']].map(c=>'<option value="'+c[0]+'" '+(state.settings.theme===c[0]?'selected':'')+'>'+c[1]+'</option>').join('')+'</select><label for="split">Divisão de treino</label><select id="split" onchange="state.split=this.value;state.day=0;save();render()"><option value="ABCD" '+(state.split==='ABCD'?'selected':'')+'>ABCD · 4 dias/semana</option><option value="ABC" '+(state.split==='ABC'?'selected':'')+'>ABC · 3 dias/semana</option></select><label for="accent">Cor de destaque</label><select id="accent" onchange="state.settings.accent=this.value;save();render()">'+[['#3b82f6','Azul'],['#10b981','Verde'],['#a78bfa','Roxo'],['#f59e0b','Âmbar'],['#ef4444','Vermelho']].map(c=>'<option value="'+c[0]+'" '+(state.settings.accent===c[0]?'selected':'')+'>'+c[1]+'</option>').join('')+'</select><label for="font">Tamanho da fonte: '+state.settings.font+'px</label><input id="font" type="range" min="13" max="21" step="1" value="'+state.settings.font+'" onchange="state.settings.font=Number(this.value);save();render()"><label><input type="checkbox" '+(state.settings.compact?'checked':'')+' onchange="state.settings.compact=this.checked;save();render()"> Cartões compactos</label></div><h2>Seus dados</h2><div class="card"><p>Dados salvos somente neste navegador. A versão 3.0 usa armazenamento separado das versões anteriores.</p><button class="secondary" onclick="exportData()">Exportar backup JSON</button> <label for="import">Restaurar backup</label><input id="import" type="file" accept=".json,application/json" onchange="importData(this)"></div>'}

const MUSCLES=[['peito','Peito'],['costas','Costas'],['biceps','Bíceps'],['triceps','Tríceps'],['ombro_anterior','Ombro anterior'],['ombro_lateral','Ombro lateral'],['ombro_posterior','Ombro posterior'],['quadriceps','Quadríceps'],['posterior','Posterior / glúteos'],['panturrilha','Panturrilha'],['abdomen','Abdômen'],['aerobico','Aeróbico']];
const BANK=[
['peito','Supino inclinado com halteres',3,'6–10',150,'composto'],['peito','Supino reto máquina',3,'8–12',120,'composto'],['peito','Voador (Peck Deck)',2,'12–15',75,'isolador'],['peito','Crossover no cabo',2,'12–15',75,'isolador'],
['costas','Puxada alta neutra',3,'8–12',120,'composto'],['costas','Remada apoiada máquina',3,'8–12',120,'composto'],['costas','Remada baixa neutra',2,'10–12',90,'composto'],['costas','Pullover na polia',2,'12–15',75,'isolador'],
['biceps','Rosca direta barra EZ',3,'8–12',90,'isolador'],['biceps','Rosca inclinada halteres',2,'10–12',75,'isolador'],['biceps','Rosca martelo',2,'10–15',75,'isolador'],
['triceps','Tríceps pulley',3,'10–12',75,'isolador'],['triceps','Tríceps francês',2,'10–15',75,'isolador'],['triceps','Tríceps testa EZ',2,'8–12',90,'isolador'],
['ombro_anterior','Desenvolvimento máquina',3,'8–12',120,'composto'],['ombro_anterior','Desenvolvimento halteres',2,'8–12',120,'composto'],
['ombro_lateral','Elevação lateral halteres',3,'12–15',75,'isolador'],['ombro_lateral','Elevação lateral cabo',2,'12–15',75,'isolador'],
['ombro_posterior','Crucifixo inverso máquina',3,'12–15',75,'isolador'],['ombro_posterior','Face pull',2,'12–15',75,'isolador'],
['quadriceps','Agachamento livre',3,'6–10',150,'composto'],['quadriceps','Leg press 45°',3,'10–12',120,'composto'],['quadriceps','Cadeira extensora',2,'12–15',75,'isolador'],
['posterior','Stiff com halteres',3,'8–12',120,'composto'],['posterior','Mesa flexora',3,'10–15',90,'isolador'],['posterior','Elevação pélvica',2,'8–12',120,'composto'],
['panturrilha','Panturrilha em pé',3,'12–20',75,'isolador'],['panturrilha','Panturrilha sentado',2,'12–20',75,'isolador'],
['abdomen','Abdominal na polia',3,'12–15',60,'isolador'],['abdomen','Prancha',3,'30–45 s',60,'isolador'],
['aerobico','Caminhada inclinada',1,'15–25 min',0,'cardio'],['aerobico','Bicicleta ergométrica',1,'15–25 min',0,'cardio']
];
state.planSelected=Array.isArray(state.planSelected)?state.planSelected:['peito','triceps'];
state.planMinutes=state.planMinutes||60;state.planStrategy=state.planStrategy||'padrao';state.planGoal=state.planGoal||'hipertrofia';state.generated=state.generated||null;state.settings.theme=state.settings.theme||'dark';
function toggleMuscle(m){state.planSelected=state.planSelected.includes(m)?state.planSelected.filter(x=>x!==m):[...state.planSelected,m];save();render()}
function lastExercise(name){for(const sess of state.sessions){if(Array.isArray(sess.exercises)&&sess.exercises.some(e=>e.name===name))return sess.date}return null}
function lastMuscle(m){for(const sess of state.sessions){if(Array.isArray(sess.muscles)&&sess.muscles.includes(m))return sess.date}return null}
function hoursSince(t){return t?Math.floor((Date.now()-t)/3600000):null}
function muscleOf(name){let n=name.toLowerCase();if(/panturrilha|gêmeos|soleo/.test(n))return 'panturrilha';if(/agachamento|leg press|extensora|afundo|búlgar|hack squat/.test(n))return 'quadriceps';if(/flexora|stiff|terra|elevação pélvica|glúteo/.test(n))return 'posterior';if(/abdominal|prancha|crunch/.test(n))return 'abdomen';if(/bike|bicicleta|caminhada|esteira|aeróbico/.test(n))return 'aerobico';if(/rosca/.test(n))return 'biceps';if(/tríceps|triceps|francês|testa/.test(n))return 'triceps';if(/elevação lateral|elevacao lateral/.test(n))return 'ombro_lateral';if(/posterior|face pull|crucifixo inverso/.test(n))return 'ombro_posterior';if(/desenvolvimento|arnold press/.test(n))return 'ombro_anterior';if(/supino|voador|peck deck|crossover|crucifixo|paralela/.test(n))return 'peito';if(/remada|puxada|pullover|barra fixa|rack pull/.test(n))return 'costas';return null}
function proOptions(m){let items=[];PRO_DATA.forEach(p=>p.groups.forEach(g=>g.exs.forEach(e=>{if(muscleOf(e.name)===m&&!items.some(x=>x.name===e.name)){items.push({name:e.name,source:p.name,series:e.series,rest:e.rest||90,tech:e.tech||''})}})));PERSONALITIES.filter(p=>p.groups&&p.groups.length).forEach(p=>p.groups.forEach(g=>g.exs.forEach(e=>{if(muscleOf(e.name)===m&&!items.some(x=>x.name===e.name))items.push({name:e.name,source:p.name,series:e.series,rest:90,tech:'Rotina de referência; adapte séries e cargas.'})})));return items}
function targetCount(m){return m==='peito'||m==='costas'?4:m==='quadriceps'?4:m==='posterior'?3:m==='aerobico'?1:3}
function generatePlan(){
const selected=state.planSelected;if(!selected.length){alert('Selecione ao menos um grupo muscular.');return}
let minutes=Number(state.planMinutes),result=[],target=selected.reduce((n,m)=>n+targetCount(m),0);
for(const m of selected){let options=BANK.filter(e=>e[0]===m).map(e=>({muscle:e[0],name:e[1],sets:e[2],reps:e[3],rest:e[4],kind:e[5],hours:hoursSince(lastExercise(e[1]))}));
for(const p of proOptions(m)){if(!options.some(o=>o.name===p.name))options.push({muscle:m,name:p.name,sets:2,reps:'8–12',rest:p.rest,kind:'isolador',hours:hoursSince(lastExercise(p.name)),source:p.source})}
options.sort((a,b)=>{let p=x=>x.hours===null?1000:x.hours;return p(b)-p(a)});
let pick=options.slice(0,Math.min(targetCount(m),options.length));pick.sort((a,b)=>state.planStrategy==='pre'?(a.kind==='isolador'?0:1)-(b.kind==='isolador'?0:1):(a.kind==='composto'?0:1)-(b.kind==='composto'?0:1));result.push(...pick)}
if(selected.includes('aerobico'))result.sort((a,b)=>(a.muscle==='aerobico'?1:0)-(b.muscle==='aerobico'?1:0));
let estimate=result.reduce((n,e)=>n+(e.muscle==='aerobico'?20:e.sets*(1+(e.rest||90)/60)),8);
state.generated={date:Date.now(),muscles:[...selected],goal:state.planGoal,strategy:state.planStrategy,exercises:result,minutes,estimate:Math.round(estimate)};state.tab='planner';save();render();
}
function renderPlanner(){
let warnings=state.planSelected.map(m=>{let h=hoursSince(lastMuscle(m));return h!==null&&h<48?MUSCLES.find(x=>x[0]===m)[1]+' treinado há '+h+'h':''}).filter(Boolean);
return '<div class="eyebrow">Treino Pro / Planejador inteligente</div><h1>Vai treinar o quê hoje?</h1><p>Escolha os grupos e gere uma sugestão adaptável ao seu histórico.</p><div class="card"><div class="musclegrid">'+MUSCLES.map(([id,name])=>'<button class="muscle '+(state.planSelected.includes(id)?'chosen':'')+'" onclick="toggleMuscle(&quot;'+id+'&quot;)">'+(state.planSelected.includes(id)?'✓ ':'○ ')+esc(name)+'</button>').join('')+'</div><label>Objetivo</label><select onchange="state.planGoal=this.value;save()"><option value="hipertrofia" '+(state.planGoal==='hipertrofia'?'selected':'')+'>Hipertrofia</option><option value="forca" '+(state.planGoal==='forca'?'selected':'')+'>Força</option><option value="leve" '+(state.planGoal==='leve'?'selected':'')+'>Treino leve</option></select><label>Tempo disponível</label><select onchange="state.planMinutes=Number(this.value);save()">'+[30,45,60,75,90].map(n=>'<option '+(state.planMinutes==n?'selected':'')+' value="'+n+'">'+n+' minutos</option>').join('')+'</select><label>Estratégia de ordem</label><select onchange="state.planStrategy=this.value;save()"><option value="padrao" '+(state.planStrategy==='padrao'?'selected':'')+'>Compostos primeiro</option><option value="pre" '+(state.planStrategy==='pre'?'selected':'')+'>Pré-exaustão (isoladores primeiro)</option></select>'+(warnings.length?'<p class="warn">⚠ Recuperação: '+esc(warnings.join('; '))+'. Avalie fadiga e recuperação antes de repetir.</p>':'')+'<button class="primary" onclick="generatePlan()">✦ Selecionar exercícios</button></div>'+(state.generated?renderGenerated():'<div class="card"><b>Como a seleção funciona</b><p>Prioriza movimentos não registrados recentemente, organiza compostos e isoladores e limita o número de exercícios ao tempo disponível. É uma regra inicial, não uma avaliação clínica.</p></div>')}
function renderGenerated(){let p=state.generated;return '<div class="card"><div class="row"><h2>Treino sugerido</h2><span class="pill">'+p.minutes+' min disponíveis</span></div><p>'+p.exercises.length+' exercícios · duração estimada '+p.estimate+' min. '+(p.estimate>p.minutes?'⚠ O volume solicitado excede o tempo disponível; reduza exercícios ou aumente o tempo.':'Revise a ordem e ajuste as cargas.')+'</p>'+p.exercises.map((e,i)=>'<div class="historyitem"><div class="row"><b>'+(i+1)+'. '+esc(e.name)+'</b><span class="pill">'+esc(MUSCLES.find(x=>x[0]===e.muscle)?.[1]||e.muscle)+'</span></div><div class="muted">'+e.sets+' × '+esc(e.reps)+' · '+(e.rest?e.rest+'s descanso':'cardio')+'</div><div class="tiny">'+(e.source?'Referência: '+esc(e.source)+' · ':'')+(e.hours===null?'Sem histórico deste exercício':'Última execução há '+e.hours+'h')+'</div><label for="swap-'+i+'">Trocar exercício</label><select id="swap-'+i+'" onchange="replaceGenerated('+i+',this.value)"><option value="">Selecione uma alternativa...</option>'+swapOptions(e).map((o,j)=>'<option value="'+j+'">'+esc(o.name)+(o.source?' — '+esc(o.source):' — Banco Treino Pro')+'</option>').join('')+'</select></div>').join('')+'<button class="primary" onclick="beginGenerated()">Iniciar este treino</button></div>'}
function swapOptions(e){let options=BANK.filter(x=>x[0]===e.muscle&&x[1]!==e.name).map(x=>({name:x[1],muscle:x[0],sets:x[2],reps:x[3],rest:x[4],kind:x[5],hours:hoursSince(lastExercise(x[1]))}));for(const p of proOptions(e.muscle)){if(p.name!==e.name&&!options.some(o=>o.name===p.name))options.push({name:p.name,muscle:e.muscle,sets:2,reps:'8–12',rest:p.rest,kind:'isolador',hours:hoursSince(lastExercise(p.name)),source:p.source})}return options}
function replaceGenerated(i,index){if(index==='')return;let e=state.generated.exercises[i],o=swapOptions(e)[Number(index)];if(!o)return;state.generated.exercises[i]=o;save();render()}
function beginGenerated(){state.activeGenerated=JSON.parse(JSON.stringify(state.generated));state.generatedLogs={};state.tab='generatedWorkout';save();render()}
function changeGeneratedSets(i,delta){let e=state.activeGenerated?.exercises?.[i];if(!e)return;let next=e.sets+delta;if(next<1||next>12)return;if(delta<0){let l=state.generatedLogs[i+'-'+(e.sets-1)];if(l?.done&&!confirm('A última série está marcada como concluída. Remover mesmo assim?'))return;delete state.generatedLogs[i+'-'+(e.sets-1)]}e.sets=next;save();render()}
function changeGeneratedReps(i,value){let e=state.activeGenerated?.exercises?.[i];if(!e)return;e.reps=String(value).slice(0,25);save()}
function renderGeneratedWorkout(){let p=state.activeGenerated;if(!p)return '<p>Gere um treino primeiro.</p>';return '<h1>Treino de hoje</h1><p>'+p.muscles.map(m=>MUSCLES.find(x=>x[0]===m)?.[1]||m).join(' · ')+'</p>'+p.exercises.map((e,i)=>'<section class="card"><div class="row"><b>'+(i+1)+'. '+esc(e.name)+'</b><button class="secondary" onclick="timer('+e.rest+')">⏱</button></div><div class="muted">Sugestão: '+e.sets+' séries · '+esc(e.reps)+' repetições</div><div class="series-controls"><button class="secondary" onclick="changeGeneratedSets('+i+',-1)" aria-label="Remover série">−</button><strong>'+e.sets+' séries</strong><button class="secondary" onclick="changeGeneratedSets('+i+',1)" aria-label="Adicionar série">+ Adicionar série</button></div><label>Meta de repetições (editável)</label><input class="reps-target" type="text" maxlength="25" value="'+esc(e.reps)+'" onchange="changeGeneratedReps('+i+',this.value)">'+Array.from({length:e.sets},(_,j)=>{let k=i+'-'+j,l=state.generatedLogs[k]||{};return '<div class="setrow"><span>'+(j+1)+'</span><input type="number" inputmode="decimal" placeholder="kg" value="'+esc(l.kg||'')+'" onchange="logGenerated(&quot;'+k+'&quot;,&quot;kg&quot;,this.value)"><input type="number" inputmode="numeric" placeholder="reps" value="'+esc(l.reps||'')+'" onchange="logGenerated(&quot;'+k+'&quot;,&quot;reps&quot;,this.value)"><button class="'+(l.done?'done':'')+'" onclick="logGenerated(&quot;'+k+'&quot;,&quot;done&quot;,'+(!l.done)+');render()">'+(l.done?'✓':'○')+'</button></div>'}).join('')+'</section>').join('')+'<button class="primary" onclick="finishGenerated()">Concluir e salvar treino</button>'}
function logGenerated(k,field,value){state.generatedLogs[k]||={};state.generatedLogs[k][field]=value;save()}
function finishGenerated(){let p=state.activeGenerated;let sets=0,volume=0;p.exercises.forEach((e,i)=>{for(let j=0;j<e.sets;j++){let l=state.generatedLogs[i+'-'+j]||{};if(l.done){sets++;volume+=(Number(l.kg)||0)*(Number(l.reps)||0)}}});if(!sets){alert('Marque pelo menos uma série concluída.');return}state.sessions.unshift({date:Date.now(),name:'Treino personalizado · '+p.muscles.map(m=>MUSCLES.find(x=>x[0]===m)?.[1]||m).join(' + '),sets,volume,muscles:p.muscles,exercises:p.exercises});state.sessions=state.sessions.slice(0,250);state.activeGenerated=null;state.generatedLogs={};state.tab='history';save();render()}

const originalPros=renderPros;renderPros=function(){return originalPros()+'<h2>Outras personalidades</h2>'+PERSONALITIES.map(p=>'<details class="card"><summary><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.tag)+'</span></summary><p>'+esc(p.desc)+'</p>'+(p.groups||[]).map(g=>'<h2>'+esc(g.name)+'</h2>'+g.exs.map(e=>'<div class="historyitem"><b>'+esc(e.name)+'</b><div class="muted">'+esc(e.series)+'</div></div>').join('')).join('')+(p.source?'<p><a href="'+esc(p.source)+'" target="_blank" rel="noopener noreferrer">Ver fonte da rotina ↗</a></p>':'')+'</details>').join('')};

function render(){applySettings();let views={planner:renderPlanner,generatedWorkout:renderGeneratedWorkout,home:renderHome,workout:renderWorkout,history:renderHistory,pros:renderPros,settings:renderSettings};document.getElementById('app').innerHTML=(views[state.tab]||renderHome)();document.getElementById('bottom').innerHTML=[['planner','✦','Planejar'],['workout','▤','Treinos'],['history','▥','Evolução'],['pros','★','Biblioteca'],['settings','⚙','Ajustes']].map(x=>'<button class="'+(state.tab===x[0]?'active':'')+'" onclick="nav(&quot;'+x[0]+'&quot;)"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Erro de inicialização</h2><p>'+esc(e.message)+'</p></div>'}
