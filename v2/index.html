function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('O armazenamento está indisponível neste navegador.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function applySettings(){document.documentElement.style.setProperty('--accent',state.settings.accent);document.documentElement.style.setProperty('--font',state.settings.font+'px');document.body.classList.toggle('compact',!!state.settings.compact)}

function start(){session={start:Date.now(),split:state.split,day:state.day};state.tab='workout';save();render()}
function complete(){const count=doneCount();if(!count){alert('Marque pelo menos uma série concluída.');return}const volume=exercises().reduce((sum,e,i)=>sum+Array.from({length:setCount(e)},(_,j)=>getlog(i,j)).reduce((a,l)=>a+(l.done?(Number(l.kg)||0)*(Number(l.reps)||0):0),0),0);state.sessions.unshift({date:Date.now(),name:day().name,sets:count,volume,minutes:session?Math.max(1,Math.round((Date.now()-session.start)/60000)):null});state.sessions=state.sessions.slice(0,250);Object.keys(state.logs).forEach(k=>{if(k.startsWith(state.split+':'+state.day+':'))state.logs[k].done=false});session=null;state.tab='history';save();render();alert('Treino registrado!')}

function timer(sec){clearInterval(timerId);remaining=sec;let el=document.getElementById('timer');el.classList.remove('hide');function tick(){el.innerHTML='<span>⏱ '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')+'</span> <button onclick="stopTimer()" aria-label="Fechar">✕</button>';if(remaining<=0){clearInterval(timerId);return}remaining--}tick();timerId=setInterval(tick,1000)}function stopTimer(){clearInterval(timerId);document.getElementById('timer').classList.add('hide')}

function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='treinopro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.logs||!Array.isArray(x.sessions))throw Error();if(confirm('Substituir os registros atuais pelo backup?')){state={...state,...x};save();render()}}catch(e){alert('Arquivo de backup inválido')}};r.readAsText(f)}
function renderSettings(){return '<h1>Personalização</h1><div class="card"><label for="split">Divisão de treino</label><select id="split" onchange="state.split=this.value;state.day=0;save();render()"><option value="ABCD" '+(state.split==='ABCD'?'selected':'')+'>ABCD · 4 dias/semana</option><option value="ABC" '+(state.split==='ABC'?'selected':'')+'>ABC · 3 dias/semana</option></select><label for="accent">Cor de destaque</label><select id="accent" onchange="state.settings.accent=this.value;save();render()">'+[['#3b82f6','Azul'],['#10b981','Verde'],['#a78bfa','Roxo'],['#f59e0b','Âmbar'],['#ef4444','Vermelho']].map(c=>'<option value="'+c[0]+'" '+(state.settings.accent===c[0]?'selected':'')+'>'+c[1]+'</option>').join('')+'</select><label for="font">Tamanho da fonte: '+state.settings.font+'px</label><input id="font" type="range" min="13" max="21" step="1" value="'+state.settings.font+'" onchange="state.settings.font=Number(this.value);save();render()"><label><input type="checkbox" '+(state.settings.compact?'checked':'')+' onchange="state.settings.compact=this.checked;save();render()"> Cartões compactos</label></div><h2>Seus dados</h2><div class="card"><p>Dados salvos somente neste navegador. A versão 2.0 usa um armazenamento separado da versão anterior.</p><button class="secondary" onclick="exportData()">Exportar backup JSON</button> <label for="import">Restaurar backup</label><input id="import" type="file" accept=".json,application/json" onchange="importData(this)"></div>'}
function render(){applySettings();let views={home:renderHome,workout:renderWorkout,history:renderHistory,pros:renderPros,settings:renderSettings};document.getElementById('app').innerHTML=(views[state.tab]||renderHome)();document.getElementById('bottom').innerHTML=[['home','⌂','Início'],['workout','▤','Treinos'],['history','▥','Evolução'],['pros','★','Biblioteca'],['settings','⚙','Ajustes']].map(x=>'<button class="'+(state.tab===x[0]?'active':'')+'" onclick="nav(&quot;'+x[0]+'&quot;)"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Erro de inicialização</h2><p>'+esc(e.message)+'</p></div>'}
</script></body></html>
